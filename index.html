
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LAST SURVIVOR - Battle Royale</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#17191c;
 font-family:Arial,sans-serif;color:white;
}
#game{
 position:fixed;inset:0;width:100%;height:100%;
}
canvas{display:block}
#ui{
 position:fixed;inset:0;pointer-events:none;
 display:flex;flex-direction:column;
 justify-content:space-between;
}
button{cursor:pointer;color:white}
.top{
 height:65px;background:linear-gradient(90deg,#10151be8,#10151b55);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 16px;pointer-events:auto;
 border-bottom:1px solid #ffffff25;
}
.logo{font-size:22px;font-weight:1000;letter-spacing:2px}
.logo span{color:#ffb33b}
.profile{display:flex;align-items:center;gap:9px}
.avatar{
 width:38px;height:38px;border-radius:50%;
 background:linear-gradient(135deg,#e69b56,#653e2c);
 border:2px solid #ffc45b;
 display:grid;place-items:center;font-size:20px;
}
.money{font-weight:bold;font-size:13px}
.money span{color:#ffce48;margin-left:5px}
.topright{display:flex;gap:12px;align-items:center}
.topright button{
 background:#ffffff15;border:1px solid #ffffff30;
 border-radius:7px;padding:9px;font-size:17px;
}
.main{
 flex:1;display:flex;align-items:center;
 justify-content:space-between;
 padding:12px 15px;
}
.sidebar{
 width:145px;display:flex;flex-direction:column;
 gap:7px;pointer-events:auto;
}
.menu{
 padding:12px 10px;text-align:left;
 background:linear-gradient(90deg,#10151bea,#10151b99);
 border:1px solid #ffffff20;
 border-left:3px solid transparent;
 font-weight:900;font-size:12px;letter-spacing:.5px;
}
.menu.active,.menu:active{
 border-left-color:#ffb43c;
 background:linear-gradient(90deg,#a65e20dd,#20242bdb);
}
.center{
 flex:1;display:flex;align-items:center;
 justify-content:center;position:relative;
 height:100%;
}
.character-label{
 position:absolute;bottom:10px;text-align:center;
 font-weight:900;letter-spacing:2px;
 text-shadow:0 2px 6px black;
}
.character-label small{
 display:block;color:#ffc15b;font-size:10px;margin-top:5px;
}
.switch{
 position:absolute;bottom:50%;display:flex;
 width:100%;justify-content:space-between;
 padding:0 12px;pointer-events:none;
}
.switch button{
 pointer-events:auto;width:38px;height:38px;
 border:1px solid #ffffff66;background:#10151b99;
 border-radius:50%;font-size:20px;
}
.rightmenu{
 width:150px;display:flex;flex-direction:column;
 align-items:flex-end;gap:9px;pointer-events:auto;
}
.mode{
 background:#171b20dd;border:1px solid #ffffff50;
 padding:11px;width:100%;text-align:center;
 font-weight:900;font-size:14px;
}
.mode small{display:block;color:#ffbd50;margin-top:5px}
.invite{
 background:#252b31dd;border:1px solid #ffffff30;
 padding:9px;width:100%;font-weight:bold;
}
.bottom{
 display:flex;justify-content:space-between;
 align-items:flex-end;padding:10px 17px 13px;
 pointer-events:auto;
 background:linear-gradient(0deg,#10151bee,transparent);
}
.chat{font-size:11px;color:#ddd}
.start{
 background:linear-gradient(120deg,#ffda69,#f39a23);
 color:#34200a;border:0;
 font-size:27px;font-weight:1000;
 padding:15px 48px;
 clip-path:polygon(8% 0,100% 0,100% 100%,0 100%);
 box-shadow:0 0 20px #ffad39;
}
.start:active{transform:scale(.96)}
#notice{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 background:#151a20f5;border:1px solid #ffbd50;
 padding:25px;width:min(310px,85vw);
 text-align:center;display:none;z-index:5;
 border-radius:10px;pointer-events:auto;
}
#notice button{
 padding:11px 25px;background:#efa72e;
 color:#251600;border:0;font-weight:bold;
 margin-top:15px;border-radius:5px;
}
#toast{
 position:fixed;top:75px;left:50%;
 transform:translateX(-50%);
 background:#151a20e8;padding:10px 20px;
 border:1px solid #ffbd50;border-radius:5px;
 display:none;font-size:12px;z-index:4;
}
@media(orientation:portrait){
 .rotate{
 position:fixed;inset:0;background:#111;
 z-index:20;display:flex!important;
 align-items:center;justify-content:center;
 text-align:center;padding:30px;
 }
}
.rotate{display:none}
@media(max-height:420px){
 .top{height:43px;padding:0 9px}
 .logo{font-size:16px}
 .menu{padding:8px;font-size:10px}
 .sidebar{width:120px;gap:4px}
 .rightmenu{width:120px;gap:5px}
 .start{font-size:20px;padding:10px 35px}
 .bottom{padding:5px 12px}
 .avatar{width:30px;height:30px}
}
</style>
</head>

<body>
<div id="game"></div>

<div class="rotate">
 <div>
  <div style="font-size:50px">📱</div>
  <h2>PUTAR HP KAMU</h2>
  <p>Game ini dirancang untuk dimainkan dalam posisi horizontal (Landscape).</p>
 </div>
</div>

<div id="ui">
 <header class="top">
  <div class="profile">
   <div class="avatar">👤</div>
   <div>
    <b>PLAYER</b>
    <div style="font-size:10px;color:#ffc45b">LEVEL 1</div>
   </div>
  </div>

  <div class="logo">LAST <span>SURVIVOR</span></div>

  <div class="topright">
   <div class="money">🪙 <span>4817</span></div>
   <div class="money">💎 <span>0</span></div>
   <button onclick="showToast('Pengaturan game')">⚙</button>
   <button onclick="showToast('Kotak pesan kosong')">✉</button>
  </div>
 </header>

 <div class="main">
  <aside class="sidebar">
   <button class="menu" onclick="menuAction('STORE')">🛒 STORE</button>
   <button class="menu" onclick="menuAction('LUCK ROYALE')">🎁 LUCK ROYALE</button>
   <button class="menu active" onclick="menuAction('CHARACTER')">👤 CHARACTER</button>
   <button class="menu" onclick="menuAction('VAULT')">🎒 VAULT</button>
   <button class="menu" onclick="menuAction('PET')">🐾 PET</button>
   <button class="menu" onclick="menuAction('COLLECTION')">🏆 COLLECTION</button>
   <button class="menu" onclick="menuAction('WEAPONS')">🔫 WEAPONS</button>
  </aside>

  <section class="center">
   <div class="switch">
    <button onclick="changeCharacter(-1)">❮</button>
    <button onclick="changeCharacter(1)">❯</button>
   </div>
   <div class="character-label">
    <span id="characterName">MALE SOLDIER</span>
    <small>CHARACTER SELECTION</small>
   </div>
  </section>

  <aside class="rightmenu">
   <button class="mode" onclick="showToast('CLASSIC MODE DIPILIH')">
    CLASSIC
    <small>ISLAND MAP ▼</small>
   </button>
   <button class="invite" onclick="showToast('Fitur undangan akan datang')">♧ INVITE</button>
   <div style="font-size:24px;margin-top:20px">🏆</div>
   <div style="font-size:24px">📅</div>
   <div style="font-size:24px">🎯</div>
  </aside>
 </div>

 <footer class="bottom">
  <div class="chat">💬 WORLD CHAT<br>Welcome to LAST SURVIVOR</div>
  <button class="start" onclick="startGame()">START ▶</button>
 </footer>
</div>

<div id="notice">
 <h2 id="noticeTitle">LAST SURVIVOR</h2>
 <p id="noticeText">Coming Soon</p>
 <button onclick="closeNotice()">OK</button>
</div>

<div id="toast"></div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9c6554);
scene.fog=new THREE.FogExp2(0x9c6554,0.012);

const camera=new THREE.PerspectiveCamera(
 42,window.innerWidth/window.innerHeight,0.1,300
);
camera.position.set(0,2.8,10);
camera.lookAt(0,1.4,0);

const renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
document.getElementById('game').appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xb9d6ff,0x463326,2));

const sunLight=new THREE.DirectionalLight(0xffc08a,3);
sunLight.position.set(-5,10,6);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(1024,1024);
scene.add(sunLight);

// MATERIALS
function mat(color,roughness=0.8){
 return new THREE.MeshStandardMaterial({
  color,roughness
 });
}

const concrete=mat(0x555653);
const dark=mat(0x242b30);
const metal=mat(0x697276,0.4);
const orange=mat(0xd17b36);
const sand=mat(0x777064);

// OBJECT HELPER
function box(x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),material
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

// GROUND
box(0,-0.25,0,100,0.5,100,concrete);
box(0,0.01,0,22,0.06,18,dark);

// PLATFORM
box(0,0.12,0,12,0.2,8,metal);
box(0,0.24,0,11.7,0.08,7.7,concrete);

// FLOOR MARKINGS
for(let i=-4;i<=4;i++){
 box(i*1.1,0.29,-3.6,0.025,0.012,0.6,orange);
}

// HANGAR
box(-8,3,-5,5,6,1,dark);
box(8,3,-6,5,6,1,dark);
box(-8,6,-5,5.3,0.3,1.4,metal);
box(8,6,-6,5.3,0.3,1.4,metal);

// BUILDINGS
box(-12,2,-13,7,4,7,sand);
box(12,2,-15,8,4,8,dark);
box(-4,1.5,-17,5,3,5,concrete);
box(5,2,-20,7,4,5,sand);

// ROOFS
box(-12,4.2,-13,7.5,0.3,7.5,dark);
box(12,4.2,-15,8.5,0.3,8.5,metal);

// CRATES
function crate(x,z){
 box(x,0.9,z,1.2,1.5,1.2,orange);
 box(x,0.95,z,1.25,0.12,1.25,dark);
 box(x,0.9,z,0.12,1.55,1.28,dark);
}
crate(-5,-2);
crate(5,-3);
crate(-10,1);
crate(10,2);

// LIGHT POLES
function lamp(x,z){
 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.07,.1,4,8),metal
 );
 pole.position.set(x,2,z);
 scene.add(pole);
 const light=new THREE.PointLight(0xffa74c,12,8);
 light.position.set(x,4.1,z);
 scene.add(light);
 const bulb=new THREE.Mesh(
  new THREE.SphereGeometry(.17,12,12),
  new THREE.MeshBasicMaterial({color:0xffca76})
 );
 bulb.position.copy(light.position);
 scene.add(bulb);
}
lamp(-7,-1);
lamp(7,-1);

// DISTANT MOUNTAINS
for(let i=0;i<15;i++){
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(3+Math.random()*3,5+Math.random()*5,5),
  mat(0x65504a)
 );
 mountain.position.set(-25+i*4,2,-28-Math.random()*5);
 scene.add(mountain);
}

// SUN
const sun=new THREE.Mesh(
 new THREE.SphereGeometry(2,24,24),
 new THREE.MeshBasicMaterial({color:0xffbd75})
);
sun.position.set(-12,9,-35);
scene.add(sun);

// CHARACTER BUILDER
const characters=[];
let selected=0;

function capsule(radius,length,material){
 return new THREE.Mesh(
  new THREE.CapsuleGeometry(radius,length,5,10),
  material
 );
}

function makeCharacter(female=false){
 const group=new THREE.Group();

 const skin=mat(female?0xc78d6b:0xb98768);
 const shirt=mat(female?0x272b34:0x323943);
 const pants=mat(0x171c24);
 const boots=mat(0x171718);
 const armor=mat(0x4d5155);

 // LEGS
 for(let x of [-.18,.18]){
  const leg=capsule(.115,.65,pants);
  leg.position.set(x,.68,0);
  group.add(leg);

  const boot=new THREE.Mesh(
   new THREE.BoxGeometry(.24,.16,.38),boots
  );
  boot.position.set(x,.19,.08);
  group.add(boot);
 }

 // BODY
 const torso=capsule(female?.27:.31,.55,shirt);
 torso.position.y=1.48;
 torso.scale.x=female?.85:1;
 group.add(torso);

 // ARMOR
 const vest=new THREE.Mesh(
  new THREE.BoxGeometry(.53,.55,.29),armor
 );
 vest.position.set(0,1.48,-.015);
 group.add(vest);

 // HEAD
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.22,20,16),skin
 );
 head.position.y=2.13;
 group.add(head);

 // HAIR
 const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.225,16,12),
  mat(female?0x25201d:0x24201c)
 );
 hair.scale.set(1,0.7,1);
 hair.position.set(0,2.27,0);
 group.add(hair);

 // ARMS
 const armMaterial=shirt;
 const arms=[];
 for(let x of [-1,1]){
  const arm=capsule(.09,.53,armMaterial);
  arm.position.set(x*.37,1.43,.02);
  arm.rotation.z=x*-.4;
  group.add(arm);
  arms.push(arm);
 }

 // GUN
 const gunGroup=new THREE.Group();
 const gun=box(0,0,0,.13,.15,1.1,dark);
 gun.position.set(0,0,0);
 gunGroup.add(gun);

 const barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(.035,.035,.65,8),metal
 );
 barrel.rotation.x=Math.PI/2;
 barrel.position.z=-.8;
 gunGroup.add(barrel);

 const magazine=new THREE.Mesh(
  new THREE.BoxGeometry(.1,.35,.16),dark
 );
 magazine.position.set(0,-.22,-.1);
 magazine.rotation.x=-.2;
 gunGroup.add(magazine);

 gunGroup.position.set(.22,1.57,.3);
 gunGroup.rotation.x=-.15;
 gunGroup.rotation.y=.2;
 group.add(gunGroup);

 group.userData.arms=arms;
 group.userData.gun=gunGroup;

 group.position.set(0,0,.1);
 scene.add(group);
 return group;
}

characters.push(makeCharacter(false));
characters.push(makeCharacter(true));

function updateCharacter(){
 characters.forEach((c,i)=>{
  c.visible=i===selected;
 });
 document.getElementById('characterName').textContent=
 selected===0?'MALE SOLDIER':'FEMALE SOLDIER';
}
updateCharacter();

window.changeCharacter=function(direction){
 selected=(selected+direction+2)%2;
 updateCharacter();
 showToast(selected===0?'MALE SOLDIER':'FEMALE SOLDIER');
};

// ANIMATION
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();

 characters.forEach((c,i)=>{
  if(!c.visible)return;
  c.position.y=Math.sin(t*1.5)*.025;
  c.rotation.y=Math.sin(t*.5)*.04;
  c.userData.arms.forEach((arm,j)=>{
   arm.rotation.x=Math.sin(t*1.5)*.025;
  });
 });

 renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

// UI FUNCTIONS
window.showToast=function(text){
 const el=document.getElementById('toast');
 el.textContent=text;
 el.style.display='block';
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display='none',2200);
};

window.menuAction=function(name){
 showToast(name+' - MENU DIPILIH');
 document.querySelectorAll('.menu').forEach(b=>{
  b.classList.toggle('active',b.textContent.includes(name));
 });
};

window.startGame=function(){
 document.getElementById('noticeTitle').textContent='BATTLE ROYALE';
 document.getElementById('noticeText').textContent=
 'Lobby berhasil dibuka! Arena pertempuran akan dikembangkan pada tahap berikutnya.';
 document.getElementById('notice').style.display='block';
};

window.closeNotice=function(){
 document.getElementById('notice').style.display='none';
};

</script>
</body>
</html>
